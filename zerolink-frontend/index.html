<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="ZeroLink: Your offline-first learning expedition — no internet required.">
  <meta name="theme-color" content="#8B5E3C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ZeroLink">
  <link rel="manifest" href="/manifest.json">
  <title>ZeroLink — Learning Expedition</title>

  <!-- Fonts: Source Sans 3 as visual match to Myriad Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Offline Banner -->
  <div id="offline-banner" class="offline-banner hidden" role="status" aria-live="polite">
    <span class="offline-icon">🏕️</span>
    <span>You're at the offline campfire — learning without a link.</span>
  </div>

  <!-- App Shell -->
  <div id="app" class="app-shell">

    <!-- Sidebar Navigation (Desktop) -->
    <nav class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">
      <div class="sidebar-logo">
        <div class="logo-mark">🧭</div>
        <div class="logo-text">
          <span class="logo-zero">Zero</span><span class="logo-link">Link</span>
        </div>
      </div>
      <ul class="sidebar-nav" role="list">
        <li><button class="nav-btn active" data-page="landing" aria-current="page" onclick="Router.navigate('landing')">
          <span class="nav-icon">🌅</span><span class="nav-label">Journey</span>
        </button></li>
        <li><button class="nav-btn" data-page="library" onclick="Router.navigate('library')">
          <span class="nav-icon">🗺️</span><span class="nav-label">Expedition Map</span>
        </button></li>
        <li><button class="nav-btn" data-page="coach" onclick="Router.navigate('coach')">
          <span class="nav-icon">📖</span><span class="nav-label">Guidebook</span>
        </button></li>
        <li><button class="nav-btn" data-page="community" onclick="Router.navigate('community')">
          <span class="nav-icon">🏘️</span><span class="nav-label">The Village</span>
        </button></li>
        <li><button class="nav-btn" data-page="settings" onclick="Router.navigate('settings')">
          <span class="nav-icon">🎒</span><span class="nav-label">Pack & Gear</span>
        </button></li>
      </ul>
      <div class="sidebar-status">
        <div class="connection-dot" id="connection-dot"></div>
        <span id="connection-label">Checking…</span>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content" id="main-content" role="main" tabindex="-1">
      <!-- Pages render here -->
    </main>

    <!-- Bottom Navigation (Mobile) -->
    <nav class="bottom-nav" role="navigation" aria-label="Mobile navigation">
      <button class="bottom-nav-btn active" data-page="landing" aria-label="Journey home" onclick="Router.navigate('landing')">
        <span class="nav-icon">🌅</span>
        <span class="nav-label">Journey</span>
      </button>
      <button class="bottom-nav-btn" data-page="library" aria-label="Expedition map" onclick="Router.navigate('library')">
        <span class="nav-icon">🗺️</span>
        <span class="nav-label">Map</span>
      </button>
      <button class="bottom-nav-btn" data-page="coach" aria-label="Study guidebook" onclick="Router.navigate('coach')">
        <span class="nav-icon">📖</span>
        <span class="nav-label">Guidebook</span>
      </button>
      <button class="bottom-nav-btn" data-page="community" aria-label="The Village" onclick="Router.navigate('community')">
        <span class="nav-icon">🏘️</span>
        <span class="nav-label">Village</span>
      </button>
      <button class="bottom-nav-btn" data-page="settings" aria-label="Pack and gear" onclick="Router.navigate('settings')">
        <span class="nav-icon">🎒</span>
        <span class="nav-label">Pack</span>
      </button>
    </nav>

  </div><!-- /app-shell -->

  <!-- Page Loading Overlay -->
  <div id="page-loader" class="page-loader hidden" role="status" aria-label="Loading">
    <div class="compass-loader">
      <div class="compass-outer">
        <div class="compass-needle"></div>
        <div class="compass-rose">✦</div>
      </div>
      <p class="loader-text">Charting your path…</p>
    </div>
  </div>

  <!-- Setup Modal (first-run) -->
  <div id="setup-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="setup-title">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-compass">🧭</div>
        <h2 id="setup-title">Pack Your Bag</h2>
        <p>Tell us about your expedition so we can prepare the best trail.</p>
      </div>
      <button id="setup-skip" aria-label="Skip setup" style="
        position:absolute;top:.75rem;right:.75rem;
        background:rgba(139,94,60,.1);border:1.5px solid var(--c-border);cursor:pointer;
        font-size:1rem;color:var(--c-text-med);font-weight:700;
        line-height:1;padding:6px 12px;border-radius:8px;
        font-family:var(--font);transition:background .15s;
      " title="Skip for now" onmouseover="this.style.background='rgba(139,94,60,.2)'" onmouseout="this.style.background='rgba(139,94,60,.1)'">Skip ✕</button>
      <form id="setup-form" class="setup-form" novalidate>
        <div class="form-group">
          <label for="setup-name">Your explorer name</label>
          <input type="text" id="setup-name" placeholder="e.g. Amara" autocomplete="given-name">
        </div>
        <div class="form-group">
          <label for="setup-internet">Do you have reliable internet?</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="internet" value="yes"> Yes, mostly
            </label>
            <label class="radio-option">
              <input type="radio" name="internet" value="sometimes"> Sometimes
            </label>
            <label class="radio-option">
              <input type="radio" name="internet" value="no" checked> Rarely/Never
            </label>
          </div>
        </div>
        <div class="form-group">
          <label for="setup-device">What device are you using?</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="device" value="smartphone" checked> 📱 Smartphone
            </label>
            <label class="radio-option">
              <input type="radio" name="device" value="tablet"> 📟 Tablet
            </label>
            <label class="radio-option">
              <input type="radio" name="device" value="laptop"> 💻 Laptop/PC
            </label>
          </div>
        </div>
        <div class="form-group">
          <label for="setup-language">Preferred language</label>
          <select id="setup-language">
            <option value="en">English</option>
            <option value="sw">Kiswahili</option>
            <option value="fr">Français</option>
            <option value="ar">العربية</option>
            <option value="hi">हिन्दी</option>
            <option value="es">Español</option>
            <option value="pt">Português</option>
            <option value="ha">Hausa</option>
          </select>
        </div>
        <button type="submit" class="btn-primary btn-full">
          Begin the Expedition 🌅
        </button>
        <p style="text-align:center;font-size:.8rem;color:var(--c-text-light);margin-top:.75rem">
          Or click <strong>Skip ✕</strong> above, or tap outside this box to explore first.
        </p>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
