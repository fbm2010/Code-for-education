version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: zerolink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       zerolink
      POSTGRES_USER:     zerolink
      POSTGRES_PASSWORD: zerolink_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerolink"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zerolink-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: zerolink-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     zerolink
      MINIO_ROOT_PASSWORD: zerolink_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO bucket init
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 zerolink zerolink_secret;
        mc mb --ignore-existing local/zerolink-media;
        mc mb --ignore-existing local/zerolink-bundles;
        mc anonymous set download local/zerolink-bundles;
        exit 0;
      "

  # API server (for production-like local runs)
  api:
    build: .
    container_name: zerolink-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    ports:
      - "3000:3000"
    profiles: ["full"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
