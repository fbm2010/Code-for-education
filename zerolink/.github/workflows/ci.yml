name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=packages/shared
      - name: Type check API
        run: npx tsc --noEmit
        working-directory: apps/api
      - name: Type check web
        run: npx tsc --noEmit
        working-directory: apps/web

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: zerolink_test
          POSTGRES_USER: zerolink
          POSTGRES_PASSWORD: zerolink
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=packages/shared
      - name: Run API tests
        run: npx vitest run
        working-directory: apps/api
        env:
          NODE_ENV: test
          DATABASE_URL_TEST: postgresql://zerolink:zerolink@localhost:5432/zerolink_test
          REDIS_URL: redis://localhost:6379
          SESSION_SECRET: test_secret_at_least_32_chars_long_x
          SYNC_ENCRYPTION_KEY: test_encryption_32_chars_minimum_x

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=packages/shared
      - run: npm run build --workspace=apps/web
        env:
          VITE_API_URL: https://api.zerolink.app
