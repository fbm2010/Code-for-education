version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: zl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zerolink
      POSTGRES_USER: zerolink
      POSTGRES_PASSWORD: zerolink
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerolink"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zl-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: zl-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zerolink
      MINIO_ROOT_PASSWORD: zerolink_secret
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 zerolink zerolink_secret;
        mc mb --ignore-existing local/zerolink-media;
        mc mb --ignore-existing local/zerolink-bundles;
        mc anonymous set download local/zerolink-bundles;
        exit 0;
      "

  mailhog:
    image: mailhog/mailhog:latest
    container_name: zl-mailhog
    restart: unless-stopped
    ports:
      - "1026:1025"
      - "8026:8025"

volumes:
  postgres_data:
  redis_data:
  minio_data:
